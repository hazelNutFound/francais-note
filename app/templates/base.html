<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FrançaisNote{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% block body %}
  {% set path = request.url.path %}
  <div class="layout">
    <nav class="sidebar">
      <a class="logo" href="/notes">FrançaisNote</a>
      <div class="nav-links">
        <a class="nav-link{% if path.startswith('/notes') %} active{% endif %}" href="/notes">My Notes</a>
        <a class="nav-link{% if path.startswith('/vocabulary') %} active{% endif %}" href="/vocabulary">My Vocabulary</a>
        <a class="nav-link{% if path.startswith('/review') %} active{% endif %}" href="/review">Review</a>
      </div>
      <form method="post" action="/logout" class="logout-form">
        <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token') }}">
        <button type="submit" class="logout-button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Logout
        </button>
      </form>
    </nav>
    <main class="content">
      <div class="container {% block container_class %}{% endblock %}">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  {% endblock %}
</body>
</html>
