{% extends "base.html" %}

{% block title %}Register · FrançaisNote{% endblock %}

{% block body %}
<main class="auth-page">
  <div class="auth-card">
    <h1>FrançaisNote</h1>
    <p class="subtitle">Create an account to start your French notebook.</p>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="/register">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" maxlength="255" required>
      <label for="password">Password (at least 8 characters)</label>
      <input type="password" id="password" name="password" minlength="8" required>
      <button type="submit">Register</button>
    </form>

    <p class="switch-link">Already have an account? <a href="/login">Log in</a></p>
  </div>
</main>
{% endblock %}
